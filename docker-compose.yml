# NEXORA - full stack: MySQL 8.4 + Spring Boot backend + nginx-served React frontend.
# Usage: cp .env.example .env  (edit the passwords)  &&  docker compose up -d --build
name: nexora

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nexora}
      MYSQL_USER: ${DB_USERNAME:-nexora}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-nexora}
      DB_USERNAME: ${DB_USERNAME:-nexora}
      DB_PASSWORD: ${DB_PASSWORD}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Almaty}
      LOW_STOCK_POLICY: ${LOW_STOCK_POLICY:-minimum-level}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-15}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_ACCOUNTS_SYNC: ${DEMO_ACCOUNTS_SYNC:-true}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@nexora.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  mysql-data:
