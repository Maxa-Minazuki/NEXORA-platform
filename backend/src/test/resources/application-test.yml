spring:
  datasource:
    url: jdbc:h2:mem:nexora;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    placeholders:
      demo_data: "true"
      demo_flight_days: "4"
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    root: WARN
    com.nexora: INFO
nexora:
  booking-expiry-check-ms: 3600000
